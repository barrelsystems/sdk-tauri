[package]
name = "tauri-plugin-barrel-kit"
version = "0.0.1"
edition = "2021"
description = "Barrel's release-intelligence SDK for Tauri apps."
license = "MIT"
repository = "https://github.com/barrelsystems/sdk-tauri"
# The test service is never shipped (see the `test-service` feature below) --
# excluded here too, so its source isn't dead weight in every consumer's
# downloaded tarball.
exclude = ["test-service/"]

[lib]
name = "tauri_plugin_barrel_kit"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2" }
tauri-plugin-updater = { version = "2" }
tauri-plugin-store = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# Policy-signature verification -- Rust's std has no Ed25519 of its own.
ed25519-dalek = { version = "2", features = ["pkcs8"] }
# Parses the embedded/rotated PEM keys ed25519-dalek's own API doesn't decode.
pkcs8 = { version = "0.10", features = ["pem", "alloc"] }
# Decodes the base64-encoded signature fields the wire protocol carries.
base64 = "0.22"
# Generates the random installation ID; std has no UUID generator.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "test-util"] }
tempfile = "3"
# Unlocks `tauri::test` (mock app/runtime) for plain `cargo test`, without
# needing the `test-service` feature. Dev-dependency features never leak
# into a real consumer's build.
tauri = { version = "2", features = ["test"] }

[features]
# Never shipped -- isolates the test service's own dependencies (axum,
# minisign) from the library consumers actually build against.
test-service = [
  "dep:axum",
  "dep:minisign",
  "dep:tauri-build",
  "dep:futures-util",
  "tauri/test",
  "tokio/process",
  "tokio/io-util",
]

[dependencies.axum]
version = "0.8"
optional = true
features = ["macros"]

[dependencies.minisign]
version = "0.10"
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true
default-features = false

[build-dependencies]
tauri-build = { version = "2", optional = true }

[[bin]]
name = "test-service"
path = "test-service/main.rs"
required-features = ["test-service"]

[profile.release]
# This SDK ships inside other people's apps -- a smaller binary is a cost
# to them, not us.
opt-level = "s"
lto = true
