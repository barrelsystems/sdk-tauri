name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --features test-service -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build

      - name: Build example app
        working-directory: examples/basic-tauri-app/src-tauri
        run: cargo build

  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build test-service
        run: cargo build --features test-service --bin test-service

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Checkout the conformance harness's built dist branch
        uses: actions/checkout@v7
        with:
          repository: barrelsystems/sdk-conformance-harness
          ref: dist
          path: sdk-conformance-harness

      - name: Install the conformance harness's runtime dependencies
        working-directory: sdk-conformance-harness
        run: npm install --omit=dev

      - name: Run conformance
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/test-service.log"
          ./target/debug/test-service > "$log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            url=$(grep -oE 'http://127.0.0.1:[0-9]+' "$log" | tail -1 || true)
            [ -n "$url" ] && break
            kill -0 "$service_pid" 2>/dev/null || { cat "$log"; exit 1; }
            sleep 0.2
          done
          if [ -z "$url" ]; then
            cat "$log"
            echo "::error::Test service did not become ready"
            exit 1
          fi
          node sdk-conformance-harness/dist/cli.js conformance "$url" --junit "$RUNNER_TEMP/conformance.xml" --history "$RUNNER_TEMP/conformance-history.json"

      - name: Show test-service diagnostics
        if: failure()
        run: cat "$RUNNER_TEMP/test-service.log" 2>/dev/null || true

  verify:
    if: always()
    needs: [verify-platform, conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and conformance run to pass
        env:
          PLATFORM_RESULT: ${{ needs.verify-platform.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
        run: test "$PLATFORM_RESULT" = success && test "$CONFORMANCE_RESULT" = success
