[package]
name = "basic-tauri-app"
version = "1.0.0"
description = "Example tauri-plugin-barrel-kit integration."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-barrel-kit = { path = "../../.." }
